[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restorebench"
version = "0.1.0"
description = "A benchmark for restoring AC power-flow convergence with LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandapower==3.4.0",
    "numba",
    "boto3",
    "pandas",
    "scipy",
    "networkx",
    "pydantic>=2",
    "anthropic>=0.120",
    "openai>=3.3.1",
]

[project.scripts]
restorebench-score = "restorebench.scoring.score_maneuvers:main"
restorebench-eval = "restorebench.eval.harness:main"
restorebench-generate = "restorebench.corpus.run_pipeline:main"
restorebench-validate = "restorebench.corpus.validate_dataset:main"
restorebench-verify = "restorebench.scoring.verify_corpus:main"
restorebench-sweep = "restorebench.sweeps.run_sweep:main"
restorebench-figures = "restorebench.sweeps.build_paper_figures:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
plots = [
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["restorebench"]

[tool.pytest.ini_options]
markers = [
    "slow: full-corpus runs over a frozen corpus; minutes, not seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["restorebench", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = [
    "networkx",
    "networkx.*",
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "pandapower",
    "pandapower.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true
